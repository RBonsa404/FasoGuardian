# Environnement de développement FasoGuardian : base, broker, serveur, proxy et observabilité.
# Prérequis : copier .env.example en .env à la racine, puis exécuter infra/generer-certificats-dev.sh.
# Démarrage : docker compose --env-file .env -f infra/docker-compose.yml up --build
name: fasoguardian

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${FG_DB_NAME:?définir FG_DB_NAME dans .env}
      POSTGRES_USER: ${FG_DB_USER:?définir FG_DB_USER dans .env}
      POSTGRES_PASSWORD: ${FG_DB_PASSWORD:?définir FG_DB_PASSWORD dans .env}
    ports:
      - "127.0.0.1:${FG_DB_PORT:-5432}:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "127.0.0.1:${FG_MQTT_PORT:-8883}:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./certs:/mosquitto/certs:ro
      - donnees-mosquitto:/mosquitto/data

  serveur:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      FG_DB_URL: jdbc:postgresql://postgres:5432/${FG_DB_NAME}
      FG_DB_USER: ${FG_DB_USER}
      FG_DB_PASSWORD: ${FG_DB_PASSWORD}
      FG_JWT_SECRET: ${FG_JWT_SECRET:?définir FG_JWT_SECRET dans .env}
      FG_ADMIN_IDENTIFIANT: ${FG_ADMIN_IDENTIFIANT:-}
      FG_ADMIN_MOT_DE_PASSE: ${FG_ADMIN_MOT_DE_PASSE:-}
      FG_SMS_ADAPTATEUR: ${FG_SMS_ADAPTATEUR:-bac-a-sable}
      FG_PAIEMENTS_ADAPTATEUR: ${FG_PAIEMENTS_ADAPTATEUR:-bac-a-sable}
      FG_PAIEMENTS_SECRET_WEBHOOK: ${FG_PAIEMENTS_SECRET_WEBHOOK:?définir FG_PAIEMENTS_SECRET_WEBHOOK dans .env}
      FG_PAIEMENTS_VALIDATION_APRES: ${FG_PAIEMENTS_VALIDATION_APRES:-}
      FG_OFFRE_D_ACCUEIL: ${FG_OFFRE_D_ACCUEIL:-}
      FG_CLE_EMPREINTE: ${FG_CLE_EMPREINTE:?définir FG_CLE_EMPREINTE dans .env}
      FG_CLE_TELEPHONE: ${FG_CLE_TELEPHONE:?définir FG_CLE_TELEPHONE dans .env}
      FG_CLE_PIECE_KYC: ${FG_CLE_PIECE_KYC:?définir FG_CLE_PIECE_KYC dans .env}
      FG_CLE_SANTE: ${FG_CLE_SANTE:?définir FG_CLE_SANTE dans .env}
      FG_CLE_SECRET_MFA: ${FG_CLE_SECRET_MFA:?définir FG_CLE_SECRET_MFA dans .env}
      FG_CLE_IMEI: ${FG_CLE_IMEI:?définir FG_CLE_IMEI dans .env}
      FG_CLE_PROFIL_ENFANT: ${FG_CLE_PROFIL_ENFANT:?définir FG_CLE_PROFIL_ENFANT dans .env}
      FG_CLE_SIGNALEMENT: ${FG_CLE_SIGNALEMENT:?définir FG_CLE_SIGNALEMENT dans .env}
      FG_CLE_COMMANDES: ${FG_CLE_COMMANDES:?définir FG_CLE_COMMANDES dans .env}
      FG_PUSH_CLE_PUBLIQUE: ${FG_PUSH_CLE_PUBLIQUE:-}
      FG_PUSH_CLE_PRIVEE: ${FG_PUSH_CLE_PRIVEE:-}
      FG_PUSH_SUJET: ${FG_PUSH_SUJET:-}
      FG_MQTT_URL: ssl://mosquitto:8883
      FG_MQTT_AUTORITE: /run/certs/ca.crt
      FG_MQTT_CERTIFICAT: /run/certs/serveur.crt
      FG_MQTT_CLE: /run/certs/serveur.key
    volumes:
      - ./certs:/run/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${FG_PROXY_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/proxy.crt:/etc/nginx/certs/proxy.crt:ro
      - ./certs/proxy.key:/etc/nginx/certs/proxy.key:ro
    depends_on:
      serveur:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observabilite/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilite/regles-alertes.yml:/etc/prometheus/regles-alertes.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:
    image: grafana/alloy:v1.10.0
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./observabilite/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${FG_GRAFANA_ADMIN_PASSWORD:?définir FG_GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observabilite/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  donnees-postgres:
  donnees-mosquitto:
