# Broker MQTT FasoGuardian (pilote) : TLS avec authentification mutuelle par certificat (REQ-SYS-012).
# L'identité MQTT d'un client est le nom commun (CN) de son certificat : un bracelet ne peut ni
# publier ni s'abonner sous l'identifiant d'un autre (voir acl).
per_listener_settings false
allow_anonymous false
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
acl_file /mosquitto/config/acl
