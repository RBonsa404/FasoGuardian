# Site public, prérendu : Angular y place deux petits scripts en ligne (relecture des événements, état). Le site
# ne porte aucune donnée personnelle ni aucun formulaire de connexion.
include /etc/nginx/entetes/communs.conf;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
