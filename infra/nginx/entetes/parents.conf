# Application Parents : aucun script en ligne ni d'ailleurs ; les tuiles de la carte viennent d'OpenStreetMap ;
# l'appareil photo sert à photographier les pièces du dossier de vérification (écran 11b).
include /etc/nginx/entetes/communs.conf;
add_header Permissions-Policy "geolocation=(), camera=(self), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
