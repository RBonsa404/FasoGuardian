# Proxy inverse FasoGuardian : terminaison TLS, en-têtes de sécurité, limitation de débit des points publics.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 12m;

    # Journal d'accès sans adresse IP ni paramètre de requête : aucune donnée personnelle (FG-DOC-06 §10.5).
    log_format technique '$time_iso8601 $request_method $uri $status $request_time $body_bytes_sent';
    access_log /dev/stdout technique;

    gzip on;
    gzip_types application/json application/problem+json text/css application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=public:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=authentification:10m rate=10r/m;
    limit_req_status 429;

    upstream serveur {
        server serveur:8080;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Supervision : jamais exposée à l'extérieur, Prometheus interroge le serveur sur le réseau interne.
        location /actuator {
            return 404;
        }

        location /api/v1/public/ {
            limit_req zone=public burst=20 nodelay;
            proxy_pass http://serveur;
        }

        location /api/v1/auth/ {
            limit_req zone=authentification burst=10 nodelay;
            proxy_pass http://serveur;
        }

        location /api/ {
            proxy_pass http://serveur;
        }

        location / {
            return 404;
        }
    }
}
