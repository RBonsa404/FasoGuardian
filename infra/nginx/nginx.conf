# Proxy inverse FasoGuardian : terminaison TLS, en-têtes de sécurité, limitation de débit des points publics,
# service des applications web (ADR 0040). Les blocs « server » sont dans modeles/*.conf.template : l'image nginx
# y substitue au démarrage les variables d'environnement FG_DOMAINE, FG_DOMAINE_CONSOLE et FG_ANDROID_EMPREINTE.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 12m;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    # Journal d'accès sans adresse IP ni paramètre de requête : aucune donnée personnelle (FG-DOC-06 §10.5).
    log_format technique '$time_iso8601 $host $request_method $uri $status $request_time $body_bytes_sent';
    access_log /dev/stdout technique;

    gzip on;
    gzip_min_length 512;
    gzip_types application/json application/problem+json text/css application/javascript image/svg+xml
               application/manifest+json;

    limit_req_zone $binary_remote_addr zone=public:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=authentification:10m rate=10r/m;
    limit_req_status 429;

    upstream serveur {
        server serveur:8080;
    }

    # Toute autre adresse que les deux noms de la plateforme est refusée : pas de réponse à un nom inconnu.
    server {
        listen 8443 ssl default_server;
        http2 on;
        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;
        return 421;
    }

    include /etc/nginx/fasoguardian/*.conf;
}
