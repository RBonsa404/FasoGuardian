spring:
  application:
    name: fasoguardian
  autoconfigure:
    # Aucun compte en mémoire : l'authentification est fournie par le module identite.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${FG_DB_URL:jdbc:postgresql://localhost:5432/fasoguardian}
    username: ${FG_DB_USER:fasoguardian}
    password: ${FG_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: plateforme
        jdbc:
          time_zone: UTC
  flyway:
    default-schema: plateforme
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Pièces KYC : 5 Mo au plus (photos compressées côté client à 400 Ko environ).
      max-file-size: 5MB
      max-request-size: 6MB
  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  port: ${FG_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Clés de chiffrement applicatif : fournies par le coffre de secrets, jamais écrites ici (FG-DOC-06 §8.3).
# Une clé = 32 octets en base64 (openssl rand -base64 32). Pour une rotation, ajouter la version 2 et
# conserver la version 1 tant que des données chiffrées avec elle subsistent.
fasoguardian:
  commandes:
    # Clé privée ECDSA P-256 (PKCS#8, base64) qui signe les commandes envoyées aux bracelets.
    cle-privee: ${FG_CLE_COMMANDES:}
  mqtt:
    # Sans adresse, le serveur ne s'abonne pas au broker (poste de développement sans Mosquitto).
    url: ${FG_MQTT_URL:}
    autorite: ${FG_MQTT_AUTORITE:}
    certificat: ${FG_MQTT_CERTIFICAT:}
    cle: ${FG_MQTT_CLE:}
    identifiant-client: ${FG_MQTT_IDENTIFIANT_CLIENT:serveur-fasoguardian-1}
    groupe: ${FG_MQTT_GROUPE:fg-serveur}
  amorcage:
    # Premier administrateur, créé seulement si aucun agent n'existe (voir AmorcageAdministrateur).
    admin:
      identifiant: ${FG_ADMIN_IDENTIFIANT:}
      mot-de-passe: ${FG_ADMIN_MOT_DE_PASSE:}
  jetons:
    # Secret de signature des jetons (HS256), 32 octets au moins en base64.
    secret: ${FG_JWT_SECRET:}
  qr:
    # Délai de réponse plancher de la page publique, identique pour un jeton valide ou non.
    delai-minimal: PT0.3S
  sms:
    # Adaptateur SMS : « bac-a-sable » tant que l'agrégateur n'est pas choisi.
    adaptateur: ${FG_SMS_ADAPTATEUR:}
  chiffrement:
    cle-empreinte: ${FG_CLE_EMPREINTE:}
    cles:
      TELEPHONE:
        1: ${FG_CLE_TELEPHONE:}
      PIECE_KYC:
        1: ${FG_CLE_PIECE_KYC:}
      SANTE:
        1: ${FG_CLE_SANTE:}
      SECRET_MFA:
        1: ${FG_CLE_SECRET_MFA:}
      IMEI:
        1: ${FG_CLE_IMEI:}
      PROFIL_ENFANT:
        1: ${FG_CLE_PROFIL_ENFANT:}

---
spring:
  config:
    activate:
      on-profile: "recette | prod"

# Recette et production : journaux structurés JSON, sans donnée personnelle (identifiants techniques uniquement).
logging:
  structured:
    format:
      console: ecs

springdoc:
  swagger-ui:
    enabled: false
