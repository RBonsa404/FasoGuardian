name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  serveur:
    name: Serveur (Maven, Testcontainers, modularité)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Construction, tests unitaires, d'architecture et d'intégration
        working-directory: backend
        run: ./mvnw -B verify
      - name: Simulateur de bracelets
        working-directory: simulator
        run: ../backend/mvnw -B -f pom.xml verify

  clients:
    name: Clients (Angular, budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        working-directory: frontend
        run: npm ci
      - name: Tests unitaires
        working-directory: frontend
        run: npm test
      - name: Construction des applications
        working-directory: frontend
        run: npm run build
      - name: Gabarit de la page QR à jour, sans script, sous 60 Ko (bloquant)
        working-directory: frontend
        run: node tools/gabarit-qr.mjs --verifier
      - name: Budget de la PWA Parents (250 Ko, bloquant)
        working-directory: frontend
        run: npm run budgets -- parents
