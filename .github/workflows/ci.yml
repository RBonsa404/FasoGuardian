name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  serveur:
    name: Serveur (Maven, Testcontainers, modularité)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Construction, tests unitaires, d'architecture et d'intégration
        working-directory: backend
        run: ./mvnw -B verify
      - name: Simulateur de bracelets
        working-directory: simulator
        run: ../backend/mvnw -B -f pom.xml verify

  clients:
    name: Clients (Angular, budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        working-directory: frontend
        run: npm ci
      - name: Tests unitaires
        working-directory: frontend
        run: npm test
      - name: Construction des applications
        working-directory: frontend
        run: npm run build
      - name: Gabarit de la page QR à jour, sans script, sous 60 Ko (bloquant)
        working-directory: frontend
        run: node tools/gabarit-qr.mjs --verifier
      - name: Budget de la PWA Parents (250 Ko, bloquant)
        working-directory: frontend
        run: npm run budgets -- parents

  firmware:
    name: Logiciel embarqué (noyau, essais sur machine hôte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Essais du noyau (alertes du compilateur bloquantes, comportement indéfini piégé)
        working-directory: firmware
        run: make essais

  e2e:
    name: Parcours de bout en bout (Playwright, pile complète)
    runs-on: ubuntu-latest
    needs: [serveur, clients]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances et navigateur
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Simulateur de bracelets (utilisé par les parcours de commandes et d'OTA)
        working-directory: simulator
        run: ../backend/mvnw -B -q -f pom.xml package -DskipTests
      - name: Pile locale (PostgreSQL, Mosquitto en TLS mutuel, serveur, applications)
        working-directory: frontend
        # Secrets, clés et certificats sont tirés au hasard pour cette seule exécution (e2e/.etat, jamais versionné).
        run: sh e2e/pile.sh demarrer
      - name: Parcours
        working-directory: frontend
        run: sh e2e/pile.sh tester
      - name: Balayage de sécurité de l'API (OWASP ZAP, contrat OpenAPI)
        # Bloquant sur tout constat de niveau FAIL ; les avertissements figurent dans le rapport (-I).
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1             zap-api-scan.py -t http://localhost:8080/v3/api-docs -f openapi -I -r rapport-zap.html
      - name: Rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-zap
          retention-days: 14
          path: zap/rapport-zap.html
          if-no-files-found: ignore
      - name: Rapport et journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rapport
          retention-days: 7
          path: |
            frontend/e2e/rapport-e2e/
            frontend/e2e/test-results/
            frontend/test-results/
            frontend/e2e/.etat/*.log
      - name: Arrêt de la pile
        if: always()
        working-directory: frontend
        run: sh e2e/pile.sh arreter
